{% load static %}
<div class="flex items-center gap-4 [&>a:hover]:underline">
    {% if comment.likes_count %}
        <div class="flex items-center gap-1">
            {% if user in comment.likes_list %}
                <img
                class="w-4 -mt-1"
                src="{% static 'images/fireheart_red.svg' %}"
                />
            {% else %}
                <img
                class="w-4 -mt-1"
                src="{% static 'images/fireheart.svg' %}"
            />
            {% endif %}
                <div>{{comment.likes_count}}</div>
        </div>
    {% endif %}
    {% if user.is_authenticated and user != comment.author%}
      
        <a class="font-bold cursor-pointer" 
        hx-get="{% url 'like-comment' comment.id %}" 
        hx-target="closest div"
        hx-swap="outerHTML"
        >
          {% if user in comment.likes_list %}
            Liked
          {% else %}
            Like
          {% endif %}
        </a>

    {% endif %}
</div>
